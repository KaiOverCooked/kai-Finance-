name: Build Android APKs

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary release keystore
        env:
          KEYSTORE_PASSWORD: android
          KEY_PASSWORD: android
        run: |
          keytool -genkeypair \
            -v \
            -keystore "$GITHUB_WORKSPACE/ci-release.keystore" \
            -storetype PKCS12 \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Kai Finance, OU=CI, O=KaiOverCooked, L=Unknown, ST=Unknown, C=ID"

      - name: Build APKs
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/ci-release.keystore
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: gradle --no-daemon assembleDebug assembleRelease

      - name: Prepare APK files
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/kai-finance-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/kai-finance-release.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kai-finance-debug-apk
          path: dist/kai-finance-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: kai-finance-release-apk
          path: dist/kai-finance-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/kai-finance-debug.apk
            dist/kai-finance-release.apk
          generate_release_notes: true
